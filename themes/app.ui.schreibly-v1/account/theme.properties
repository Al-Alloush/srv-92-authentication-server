parent=keycloak.v3
locales=en,de,ar,fr

# Brand the React Account Console (Keycloak 26) the only supported way:
# CSS-variable overrides + logo + messages. The React page templates cannot be
# overridden with FreeMarker, so no profile/security .ftl pages are provided.
styles=css/account.css

# Schreibly logo + favicon (self-hosted within this theme, no remote assets).
logo=img/schreibly-logo.png
favIcon=img/favicon.png
